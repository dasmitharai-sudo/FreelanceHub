<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="fh-card p-4 p-sm-5">
        <div class="text-center mb-4">
          <img src="/assets/images/logo.svg" alt="FreelanceHub" style="height: 48px;" class="mb-2">
          <h3 class="fw-bold mb-1">Welcome Back</h3>
          <p class="text-muted small">Log in to manage your services, projects and earnings.</p>
        </div>

        <!-- Demo Accounts Quick-Fill Pill Banner for Academic/Demonstration Ease -->
        <div class="p-3 bg-light rounded-3 mb-4 border text-center">
          <small class="fw-bold text-dark d-block mb-2"><i class="bi bi-magic text-primary me-1"></i> Quick-Fill Demo Credentials:</small>
          <div class="d-flex flex-wrap justify-content-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary" ng-click="fillDemoCredentials('client')">Client</button>
            <button type="button" class="btn btn-sm btn-outline-success" ng-click="fillDemoCredentials('freelancer')">Freelancer</button>
            <button type="button" class="btn btn-sm btn-outline-danger" ng-click="fillDemoCredentials('admin')">Admin</button>
          </div>
        </div>

        <div class="alert alert-danger py-2 small" ng-if="errorMessage">
          <i class="bi bi-exclamation-triangle-fill me-1"></i> {{errorMessage}}
        </div>

        <form ng-submit="doLogin()">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control" ng-model="loginData.email" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label small fw-semibold text-muted mb-0">Password</label>
              <a href="#!/forgot-password" class="small text-primary">Forgot Password?</a>
            </div>
            <div class="input-group mt-1">
              <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control" ng-model="loginData.password" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-fh w-100 py-2 mt-2" ng-disabled="isSubmitting">
            <span ng-if="!isSubmitting">Sign In to Account</span>
            <span ng-if="isSubmitting"><span class="spinner-border spinner-border-sm me-2"></span>Authenticating...</span>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <span class="text-muted small">Don't have an account? </span>
          <a href="#!/register" class="small fw-bold text-primary">Sign Up</a>
        </div>
      </div>
    </div>
  </div>
</div>
