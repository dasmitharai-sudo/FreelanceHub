<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="fh-card p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="stat-icon bg-success-subtle text-success mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem;">
            <i class="bi bi-shield-check"></i>
          </div>
          <h3 class="fw-bold mb-1">Set New Password</h3>
          <p class="text-muted small">Please choose a secure new password for your account.</p>
        </div>

        <div class="alert alert-danger py-2 small" ng-if="errorMessage">
          <i class="bi bi-exclamation-triangle-fill me-1"></i> {{errorMessage}}
        </div>

        <form ng-submit="doResetPassword()">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">New Password * (min 6 characters)</label>
            <input type="password" class="form-control" ng-model="resetData.password" minlength="6" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Confirm New Password *</label>
            <input type="password" class="form-control" ng-model="resetData.confirmPassword" minlength="6" required>
          </div>

          <button type="submit" class="btn btn-primary-fh w-100 py-2 mt-2" ng-disabled="isSubmitting">
            <span ng-if="!isSubmitting">Update Password & Login</span>
            <span ng-if="isSubmitting"><span class="spinner-border spinner-border-sm me-2"></span>Updating...</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
